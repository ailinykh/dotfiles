set -g mouse on

# better `pi` shortcuts
set -g extended-keys on
set -g extended-keys-format csi-u

# enable OSC 8 hyperlinks (Ghostty: Cmd+Shift+click)
set -as terminal-features ',xterm-ghostty:hyperlinks'

# Leader remap
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# This fixes scroll navigation and selection
set -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Start in the active pane's current directory
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Shift alt vim keys to switch windows
bind -n M-H previous-window
bind -n M-L next-window

# Start windows and panes from 1 instead of 0
set -g base-index 1
set -g pane-base-index 1
set-option -g renumber-windows on

set -g set-clipboard on         # use system clipboard
set -g status-position top      # macOS / darwin style

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
#set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'

set -g @continuum-restore 'on'
set -g @plugin 'tmux-plugins/tmux-continuum'

# catppuccin theme settings
set -g @plugin 'catppuccin/tmux#v2.3.0'
set -g @plugin 'xamut/tmux-weather'
set -g @tmux-weather-location "Moscow"

set -g @catppuccin_flavor "mocha"

# add rounded corners to `session` name
set -g @catppuccin_status_connect_separator "no"
set -g @catppuccin_status_left_separator  " "
set -g @catppuccin_status_right_separator " "

# this settings add rounded separators with transparent background for window titles
set -g @catppuccin_window_status_style "custom"
set -g @catppuccin_window_left_separator "#[fg=#{@catppuccin_window_text_color},bg=default]#[fg=#{@thm_crust},bg=#{@catppuccin_window_number_color}]"
set -g @catppuccin_window_right_separator "#[fg=#{@catppuccin_window_number_color},bg=default]"
set -g @catppuccin_window_current_left_separator "#[fg=#{@catppuccin_window_current_text_color},bg=default]#[fg=#{@thm_crust},bg=#{@catppuccin_window_current_number_color}]"
set -g @catppuccin_window_current_right_separator "#[fg=#{@catppuccin_window_current_number_color},bg=default]"
set -g @catppuccin_window_middle_separator " "
set -g @catppuccin_window_current_middle_separator " "
set -g @catppuccin_window_number_position "right"

# replace directory with current running tool name
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W#{?window_zoomed_flag,(),}"
set -g automatic-rename on
set -g automatic-rename-format "#{pane_current_command}"

# directory basename only
set -g @catppuccin_directory_text " #{b:pane_current_path}"

# make the whole `tmux` line transparent
set -g @catppuccin_status_background "none"

run '~/.config/tmux/plugins/tmux/catppuccin.tmux'

set -g status-left-length 100
set -g status-left "#{E:@catppuccin_status_session}"

set -g status-right-length 100
set -g status-right "#{E:@catppuccin_status_directory}"
set -agF status-right "#{E:@catppuccin_status_weather}"

run '~/.config/tmux/plugins/tpm/tpm'
